<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout - FutureJewelry</title>
  <link rel="stylesheet" href="style.css" />

  <!-- EmailJS -->
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script>
    emailjs.init("YOUR_PUBLIC_KEY_HERE"); // Replace with your actual EmailJS public key
  </script>

  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Checkout</h1>
    <a href="cart.html" class="cart-link" title="Back to Cart">⬅ Back</a>
  </header>

  <main>
    <div id="checkout-container">
      <h2>Order Summary</h2>
      <ul id="checkout-items"></ul>
      <p><strong>Total: $<span id="checkout-total">0.00</span></strong></p>

      <h2>Customer Details</h2>
      <form id="checkout-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="address">Shipping Address</label>
        <textarea id="address" name="address" required></textarea>

        <!-- Hidden fields sent to EmailJS -->
        <input type="hidden" name="items" id="hidden-items" />
        <input type="hidden" name="total" id="hidden-total" />

        <button type="submit">Place Order</button>
      </form>

      <div id="confirmation-message" style="display:none; margin-top: 2rem;">
        <h3>Please Wait While We Confirm Your Order</h3>
        <p>Please Wait For Further Email Updates.</p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 FutureJewelry. All rights reserved.</p>
  </footer>
</body>
</html>
